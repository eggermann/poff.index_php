          - iframe [ref=f2e337]:
            - generic [ref=f3e1]: "# Power Is a Public Loan Political power is not property. It is a temporary loan from people who retain the right to inspect its use, limit its reach, and withdraw their trust. Every office should therefore leave a readable trail: what was decided, who advised it, who benefited, what it cost, and when it will be reviewed. Secrecy may protect a person in danger; it should not protect routine power from embarrassment. An institution earns legitimacy less by claiming virtue than by making correction possible. Terms end. Decisions expire. Records remain open. Appeals remain practical. The democratic question is not only “Who rules?” It is also “How easily can the ruled understand, challenge, and change the rule?”"
